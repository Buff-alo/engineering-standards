name: Release

on:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: Version Bump & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab59f9 # v5.5.0
        with:
          python-version: "3.12"

      - name: Validate repository before release
        run: |
          python3 scripts/validate_profiles.py --root . --strict
          python3 -m unittest discover -s scripts -v

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Package and upload release archives
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          ./scripts/package_release.sh "$RELEASE_TAG" dist
          gh release upload "$RELEASE_TAG" \
            "dist/engineering-standards-${RELEASE_TAG}.tar.gz" \
            "dist/engineering-standards-${RELEASE_TAG}.zip" \
            "dist/SHA256SUMS.txt" \
            --clobber
