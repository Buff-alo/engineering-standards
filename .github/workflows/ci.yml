name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Standards & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab59f9 # v5.5.0
        with:
          python-version: "3.12"

      - name: Validate profiles and repository hygiene
        run: python3 scripts/validate_profiles.py --root . --strict

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts -v
